# Tests for the shared libraries in workers/lib/ that the Vercel package bundles.
# The package itself is tested by vercel.yml. Only node:test / node:assert,
# nothing to install.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib-tests:
    name: Shared library tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run workers/lib tests
        run: node --test workers/*.test.mjs
